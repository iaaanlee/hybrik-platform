# HybrIK Server Configuration

# Model Configuration
model:
  hybrik_cfg: "configs/hybrik_hrnet.yaml"  # 별칭 생성 완료
  hybrik_ckpt: "pretrained_models/hybrik_hrnet.pth"  # 아직 다운로드 필요
  smpl_model_dir: "pretrained_models/smpl"
  device: "cpu"  # cpu, cuda, mps (for Apple Silicon)
  
# Output Configuration
output:
  units: "mm"  # mm, norm
  coord_frame: "root-relative"  # root-relative, camera
  return_2d_joints: true
  return_smpl_params: false
  return_mesh: false

# Visualization Configuration (PyTorch3D Replacement)
visualization:
  backend: "trimesh+pyrender"  # Current visualization backend
  debug_vis: false            # Enable debug visualization (off in production)
  vis_output_dir: "./debug_vis"  # Output directory for debug visualizations
  joint_order_doc: "./docs/joint_order.md"  # Joint ordering documentation
  enable_2d_overlay: true     # Enable 2D keypoint overlay on input images

# Input Limits
limits:
  max_image_resolution: 2048  # pixels
  max_file_mb: 10
  request_timeout_ms: 30000
  
# Server Configuration
server:
  host: "0.0.0.0"
  port: 5002
  workers: 1
  
# Performance
performance:
  enable_warmup: true
  warmup_iterations: 3
  
# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_requests: true
  log_performance: true